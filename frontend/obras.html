<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obras | PICTEC-REA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">PR</span><span>PICTEC-REA<small>Repositório Educacional Aberto</small></span></a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="index.html">Início</a><a class="active" href="obras.html">Obras</a><a href="enviar.html">Enviar obra</a><a href="checar.html">Verificar</a>
      </nav>
    </div>
  </header>
  <main class="form-page">
    <div class="container">
      <div class="section-header">
        <h2>Obras registradas</h2>
        <p>Consulte os recursos educacionais registrados no PICTEC-REA.</p>
      </div>
      <form id="catalog-form" action="obras.html" method="get" role="search">
        <label for="catalog-query">Buscar recursos</label>
        <div class="catalog-search">
          <input type="search" id="catalog-query" name="q" placeholder="Título, autor, descrição, legendas, Libras..." aria-describedby="search-help">
          <button class="button primary" type="submit">Buscar</button>
        </div>
        <p id="search-help" class="file-help">Encontre recursos assistivos pelas palavras usadas na descrição do material.</p>
        <div class="catalog-filters">
          <label>Matéria<select name="materia"><option value="">Todas as matérias</option></select></label>
          <label>Formato do arquivo<select name="formato"><option value="">Todos os formatos</option></select></label>
          <label>Tipo de recurso<select name="tipo"><option value="">Todos os tipos</option></select></label>
          <label>Nível de ensino<select name="nivel_ensino"><option value="">Todos os níveis</option></select></label>
        </div>
        <button class="button secondary" type="reset">Limpar busca e filtros</button>
      </form>
      <p id="catalog-status" class="catalog-status" role="status"></p>
      <div id="lista" class="cards catalog-results" aria-busy="true"></div>
    </div>
  </main>
  <footer class="site-footer"><div class="container">PICTEC-REA · Repositório Educacional Aberto</div></footer>
  <script src="js/session.js"></script>
  <script type="module" src="js/obras.mjs"></script>
</body>
</html>
