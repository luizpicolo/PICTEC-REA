<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | PICTEC-REA</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">PR</span><span>PICTEC-REA<small>Repositório Educacional Aberto</small></span></a><nav class="nav"><a href="index.html">Início</a><a href="obras.html">Obras</a><a href="enviar.html">Enviar obra</a></nav></div></header>
<main class="form-page"><div class="auth-layout"><section class="form-card"><h1>Entrar</h1><p class="form-intro">Acesse sua conta para assinar as suas obras com a sua chave.</p><form id="login-form" class="form-grid"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="senha" type="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Entrar</button></form></section><section class="form-card"><h2>Criar conta</h2><p class="form-intro">Uma chave Ed25519 exclusiva será criada para a sua conta.</p><form id="register-form" class="form-grid"><label>Nome<input name="nome" type="text" required minlength="2" autocomplete="name"></label><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="senha" type="password" required minlength="10" autocomplete="new-password"><span class="file-help">Use ao menos 10 caracteres.</span></label><button class="button primary" type="submit">Criar conta</button></form></section><div id="auth-status" class="status" role="status" aria-live="polite"></div></div></main><script src="js/session.js"></script><script src="js/auth.js"></script></body></html>
